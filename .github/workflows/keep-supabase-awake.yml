# The free Supabase plan pauses a project after 7 days without activity.
# This asks the database a tiny question once a day so the shop never goes to sleep.
# The key is the public (publishable) one already in js/backend.js: it can only add orders, not read them.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *' # every day at 06:17 UTC
  workflow_dispatch: {}  # can also be run by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_4WyF_zZ6YvdrVFbuX37Mjg_jRG1j710" \
            "https://jeojeuqaduwefgsjyygu.supabase.co/rest/v1/orders?select=id&limit=1")
          echo "Supabase answered $code"
          test "$code" = "200"
